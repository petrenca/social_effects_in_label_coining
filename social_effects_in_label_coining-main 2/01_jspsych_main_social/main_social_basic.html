<!DOCTYPE html>
<html>
<!--
    Main experiment, BASIC version: only the three main phases (no consent, demographics,
    questionnaire, ID queue). Two computers, one session per pair. Read README.md first.

    How it is started (by the experimenter):
      1. On ONE computer, double-click start_local.bat (or upload to a PHP server).
      2. Open main_social_basic.html on both computers (the other computer uses the address
         printed by start_local.bat) and choose role + the SAME pair ID on both.
         Or open directly:  main_social_basic.html?role=naive&pair=1
                            main_social_basic.html?role=confederate&pair=1
         &test=1  -> data go into data_test/ and sync/state_test/
         &n=3     -> only the first 3 concepts (quick test runs)
    Assertiveness (between pairs) and the label list (which targets get the good / bad label,
    within pairs) follow from the pair ID (getCondition() in experiment_config.js) and are only
    shown on the confederate's computer.

    Phases:
      1. Grounding: both enter a label -> both labels shown -> timed discussion (or both confirm early) -> private choice
      2. Sender-receiver: naive describes the picture, confederate clicks "richtig"/"falsch" (max 3 attempts)
      3. Private naming: confederate leaves, naive names every picture again
-->

<head>
    <meta charset="UTF-8">
    <title>Bilder benennen</title>
    <script src="jspsych/jspsych.js"></script>
    <script src="jspsych/plugin-html-button-response.js"></script>
    <script src="jspsych/plugin-fullscreen.js"></script>
    <script src="jspsych/plugin-preload.js"></script>
    <script src="resources/plugin-pair-trial.js"></script>
    <link href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />

    <!-- all changeable parameters (conditions, timing, trial numbers, confederate behaviour) -->
    <script src="resources/experiment_config.js"></script>
    <script src="resources/label_similarity.js"></script>
    <!-- communication with the partner's browser - the ONLY place that talks to sync/sync.php -->
    <script src="resources/pair_sync.js"></script>

    <style>
        .screen { max-width: 900px; width: 100%; box-sizing: border-box; margin: 0 auto; text-align: center;
                  overflow-wrap: anywhere; }
        .screen img.stim { max-height: 45vh; max-width: 100%; border-radius: 6px; }
        .instructions { max-width: 760px; text-align: left; line-height: 1.5; }
        .phase2-example { margin: 0; }
        .phase2-example img { display: block; max-width: 100%; max-height: calc(100vh - 200px);
                              width: auto; height: auto; margin: 12px auto; }
        .label-input { font-size: 22px; padding: 6px 10px; width: 320px; max-width: 100%; box-sizing: border-box; }
        .input-error { color: #c62828; }
        .btn { font-size: 18px; padding: 8px 20px; margin: 8px; cursor: pointer; }
        .labels { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin: 16px 0; }
        .labels > div { flex: 1 1 220px; min-width: 0; max-width: 100%; }
        .labels.labels-stacked { flex-direction: column; }
        .labels.labels-stacked > div { flex: 0 1 auto; }
        .labels .word { font-size: 28px; font-weight: bold; overflow-wrap: anywhere; }
        .label-choice { max-width: 100%; box-sizing: border-box; white-space: normal; overflow-wrap: anywhere; }
        @media (max-width: 560px) { .labels > div { flex-basis: 100%; } }
        .timer { font-size: 20px; color: #555; margin-top: 10px; }
        .timer.over { color: #c62828; }
        .feedback { font-size: 26px; font-weight: bold; margin: 20px; }
        .feedback.ok { color: #2e7d32; }
        .feedback.wrong { color: #c62828; }
        .waiting { color: #666; font-style: italic; margin-top: 40px; }
        /* only on the confederate's computer */
        .conf { background: #fff8e1; border: 2px solid #f9a825; border-radius: 6px; padding: 8px 14px;
                margin: 12px auto; max-width: 760px; text-align: left; font-size: 16px; }
        .conf.conf--filler { background: #e3f2fd; border-color: #1976d2; }
        .conf ul { margin: 4px 0; }
        .phase2-assigned-label { margin: 20px 0 8px; padding-top: 12px; border-top: 1px solid #f9a825; }
        .phase2-confederate-label { display: block; margin-top: 4px; font-size: 24px; font-weight: bold;
                                   line-height: 1.35; color: #17365d;
                                   white-space: normal; overflow-wrap: anywhere; }
        .btn.recommended { outline: 4px solid #f9a825; }
        .traffic-light { display: flex; align-items: center; gap: 16px; text-align: left; padding: 12px 16px;
                         margin: 16px auto; max-width: 620px; border: 2px solid currentColor; border-radius: 8px; }
        .traffic-light.green { color: #1b5e20; background: #edf7ed; }
        .traffic-light.yellow { color: #6d4c00; background: #fff8e1; }
        .traffic-light.red { color: #b71c1c; background: #ffebee; }
        .traffic-light.unavailable { color: #424242; background: #f5f5f5; }
        .traffic-lamps { display: flex; flex-direction: column; gap: 5px; padding: 8px; border-radius: 8px;
                         background: #333; flex-shrink: 0; }
        .traffic-lamp { width: 16px; height: 16px; border-radius: 50%; background: #666; border: 1px solid #999; }
        .traffic-light.red .lamp-red { background: #ef5350; border-color: #ef5350; }
        .traffic-light.yellow .lamp-yellow { background: #ffca28; border-color: #ffca28; }
        .traffic-light.green .lamp-green { background: #66bb6a; border-color: #66bb6a; }
        #launcher { max-width: 420px; margin: 60px auto; font-family: sans-serif; line-height: 2; }
        #launcher input, #launcher select { font-size: 16px; }
    </style>
</head>

<body></body>

<script>
    //-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
    //----------------------0. Role, pair ID, test mode----------------------------------------------------------------------------------------------------------------------------//
    //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
    var urlParams = new URLSearchParams(window.location.search);
    var role = urlParams.get('role');   // 'naive' or 'confederate'
    var pairID = parseInt(urlParams.get('pair'));
    var TEST_MODE = urlParams.get('test') === '1';
    var requestedTestCondition = urlParams.get('test_condition');
    var TEST_ASSERTIVENESS = TEST_MODE && role === 'confederate' &&
        CONFIG.assertiveness_conditions.indexOf(requestedTestCondition) !== -1 ? requestedTestCondition : null;
    var N_OVERRIDE = parseInt(urlParams.get('n'));
    var PATHS = TEST_MODE
        ? { saveData: 'save_data_test.php', filePrefix: 'TEST_social_' }
        : { saveData: 'save_data.php', filePrefix: 'social_' };
    var START_TIME = Date.now();
    var PHASE2_EXAMPLE_IMAGE = 'stimuli/Example%20image_Phase%202.png';

    if ((role !== 'naive' && role !== 'confederate') || !(pairID > 0)) {
        showLauncher();
    } else {
        fetch(CONFIG.stimuli_file, { cache: 'no-store' })
            .then(function (r) { if (!r.ok) throw new Error(CONFIG.stimuli_file + ': HTTP ' + r.status); return r.text(); })
            .then(function (text) { runExperiment(parseCSV(text)); })
            .catch(function (err) {
                document.body.innerHTML = '<p style="color:#c62828;padding:20px;">Fehler beim Laden der Stimuli: ' +
                    escapeHTML(String(err)) + '<br>Die Seite muss über den Server (start_local.bat) geöffnet werden, nicht als Datei.</p>';
            });
    }

    // start page for the experimenter: choose role and pair ID, then reload with ?role=...&pair=...
    function showLauncher() {
        document.body.innerHTML =
            '<form id="launcher">' +
            '<h2>Experiment starten</h2>' +
            'Rolle: <select name="role"><option value="naive">Versuchsperson</option>' +
            '<option value="confederate">Confederate</option></select><br>' +
            'Paar-ID: <input name="pair" type="number" min="1" required style="width:80px"> ' +
            '<small>(auf beiden Computern gleich)</small><br>' +
            '<label><input name="test" type="checkbox" value="1"> Testmodus</label><br>' +
            '<label id="test-condition-row" hidden>Bedingung (nur Testmodus): ' +
            '<select name="test_condition" disabled>' +
            '<option value="">Automatisch (Paar-ID)</option>' +
            '<option value="compliant">Compliant</option>' +
            '<option value="assertive">Assertive</option>' +
            '</select><br></label>' +
            'Anzahl Bilder: <input name="n" type="number" min="1" style="width:60px"> ' +
            '<small>(leer = alle; nur für Tests)</small><br>' +
            '<button class="btn" type="submit">Weiter</button>' +
            '</form>';
        var form = document.getElementById('launcher');
        var conditionRow = document.getElementById('test-condition-row');
        form.role.value = role === 'confederate' ? 'confederate' : 'naive';
        form.test.checked = TEST_MODE;
        if (TEST_ASSERTIVENESS) form.test_condition.value = TEST_ASSERTIVENESS;
        function updateTestCondition() {
            var available = form.test.checked && form.role.value === 'confederate';
            conditionRow.hidden = !available;
            form.test_condition.disabled = !available;
        }
        form.role.addEventListener('change', updateTestCondition);
        form.test.addEventListener('change', updateTestCondition);
        updateTestCondition();
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var f = e.target;
            var q = '?role=' + f.role.value + '&pair=' + parseInt(f.pair.value) + (f.test.checked ? '&test=1' : '') +
                (parseInt(f.n.value) > 0 ? '&n=' + parseInt(f.n.value) : '');
            if (f.test.checked && f.role.value === 'confederate' &&
                    CONFIG.assertiveness_conditions.indexOf(f.test_condition.value) !== -1) {
                q += '&test_condition=' + encodeURIComponent(f.test_condition.value);
            }
            window.location.search = q;
        });
    }

    //-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
    //----------------------Helpers-------------------------------------------------------------------------------------------------------------------------------------------------//
    //---------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
    function parseCSV(text) {
        var lines = text.trim().split(/\r?\n/);
        var headers = lines[0].split(',');
        return lines.slice(1).map(function (line) {
            var values = line.split(',');
            var obj = {};
            headers.forEach(function (h, i) { obj[h] = values[i]; });
            return obj;
        });
    }

    // labels are always shown in capital letters (as in Exp2)
    function caps(s) {
        return escapeHTML(String(s).toUpperCase());
    }

    function escapeHTML(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // labels count as the same regardless of case and surrounding spaces
    function normalize(s) {
        return String(s || '').trim().toLowerCase();
    }

    function submittedLabel(s) {
        return String(s || '').trim().toUpperCase();
    }

    function labelSimilarityReady() {
        return typeof LabelSimilarity !== 'undefined' && LabelSimilarity !== null &&
            typeof LabelSimilarity.compare === 'function';
    }

    // Exact-use data must remain available even if the optional similarity script fails to load.
    function phase2LabelsEqual(term, reference) {
        var candidate = submittedLabel(term).normalize('NFC');
        var assigned = submittedLabel(reference).normalize('NFC');
        return candidate.length > 0 && candidate === assigned;
    }

    function textInputMaxLength() {
        var limit = CONFIG.text_input_max_length;
        return Number.isInteger(limit) && limit > 0 ? limit : 40;
    }

    // Same order on both computers without communication: shuffle seeded by pair ID and phase.
    function seededShuffle(array, seed) {
        var a = array.slice();
        var rand = function () { // mulberry32
            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(rand() * (i + 1));
            var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }

    // 20 concepts in a full phase: 16 targets and 4 fillers, with target-only edges
    // and at least one target between fillers. Short &n= subsets may need relaxed edges.
    function orderConcepts(concepts, seed) {
        var edge = CONFIG.filler_free_edge_trials;
        if (!Number.isInteger(edge) || edge < 0) edge = 3;
        var targets = seededShuffle(concepts.filter(function (c) { return !c.is_filler; }), seed);
        var fillers = concepts.filter(function (c) { return c.is_filler; });
        // Separation is impossible in some tiny test subsets; keep every selected concept.
        if (fillers.length > targets.length + 1) return seededShuffle(concepts, seed);
        if (targets.length < 2 * edge || fillers.length > targets.length - 2 * edge + 1) edge = 0;

        // Gap i is before target i (gap targets.length is after the last target).
        // Use distinct gaps so that two fillers can never be adjacent.
        var gaps = [];
        for (var i = edge; i <= targets.length - edge; i++) gaps.push(i);
        var fillerGaps = seededShuffle(gaps, seed ^ 0x9E3779B9).slice(0, fillers.length);
        fillers = seededShuffle(fillers, seed ^ 0x85EBCA6B);
        var ordered = [];
        for (var j = 0; j <= targets.length; j++) {
            if (fillerGaps.indexOf(j) !== -1) ordered.push(fillers.shift());
            if (j < targets.length) ordered.push(targets[j]);
        }
        return ordered;
    }

    // Keep the previous phase's final two concepts out of the next phase's first two slots.
    // Same-category swaps preserve every filler position, including target-only edges.
    function separatePhaseOrders(previousOrder, nextOrder, seed) {
        var order = nextOrder.slice();
        var excluded = new Set(previousOrder.slice(-2).map(function (c) { return c.concept_nr; }));
        var replacementIndices = seededShuffle(order.map(function (c, i) { return i; }).slice(2), seed ^ 0xA511E9B3);
        var unresolvedConcepts = [];
        for (var i = 0; i < Math.min(2, order.length); i++) {
            if (!excluded.has(order[i].concept_nr)) continue;
            var replacement = replacementIndices.find(function (j) {
                return !excluded.has(order[j].concept_nr) && order[j].is_filler === order[i].is_filler;
            });
            // Tiny test subsets can make these constraints incompatible. Keep every concept
            // and report the remaining conflicts on the experimenter's setup screen and in data.
            if (replacement === undefined) {
                unresolvedConcepts.push(order[i].concept_nr);
                continue;
            }
            var swap = order[i];
            order[i] = order[replacement];
            order[replacement] = swap;
        }
        return { order: order, unresolvedConcepts: unresolvedConcepts };
    }

    function minutesText(ms) {
        var m = Math.round(ms / 60000);
        return m === 1 ? '1 Minute' : m + ' Minuten';
    }

    function formatTime(ms) {
        var s = Math.ceil(ms / 1000);
        return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    }

    function runExperiment(stimuliRows) {
        var jsPsych = initJsPsych({});
        var condition = getCondition(pairID);   // { assertiveness, label_goodness }
        var isConf = role === 'confederate';
        var assignedAssertiveness = condition.assertiveness;
        if (TEST_ASSERTIVENESS) condition.assertiveness = TEST_ASSERTIVENESS;
        PairSync.join(pairID, role, TEST_MODE);

        var concepts = stimuliRows.map(function (r) {
            var goodness = getLabelGoodness(pairID, parseInt(r.concept_nr), r.item_type);
            return {
                concept_nr: parseInt(r.concept_nr),
                concept_id: r.concept_id,
                image: CONFIG.image_folder + r.image,
                is_filler: r.item_type === 'filler',
                label_goodness: goodness,                  // 'good' / 'bad' (targets), 'middle' (fillers)
                scripted_label: r[goodness + '_label'],    // label the confederate is told to enter
            };
        });
        // test runs (&n=...): a subset of the items, chosen by pair ID - other pair IDs give other items
        if (N_OVERRIDE > 0) concepts = seededShuffle(concepts, pairID).slice(0, N_OVERRIDE);

        var phase1Order = orderConcepts(concepts, pairID * 10 + 1);
        var phase2Transition = separatePhaseOrders(phase1Order, orderConcepts(concepts, pairID * 10 + 2), pairID * 10 + 2);
        var phase2Order = phase2Transition.order;
        // Repairing Phase 2 can change its tail, so Phase 3 must use the adjusted order.
        var phase3Transition = separatePhaseOrders(phase2Order, orderConcepts(concepts, pairID * 10 + 3), pairID * 10 + 3);
        var phase3Order = phase3Transition.order;
        var phaseBoundaryWarnings = [];
        if (phase2Transition.unresolvedConcepts.length) {
            phaseBoundaryWarnings.push('Teil 1 → 2: Bildnummern ' + phase2Transition.unresolvedConcepts.join(', '));
        }
        if (phase3Transition.unresolvedConcepts.length) {
            phaseBoundaryWarnings.push('Teil 2 → 3: Bildnummern ' + phase3Transition.unresolvedConcepts.join(', '));
        }

        // these columns are added to every row of the data file
        jsPsych.data.addProperties({
            pair_id: pairID,
            role: role,
            assertiveness: condition.assertiveness,
            assigned_assertiveness: assignedAssertiveness,
            test_condition_override: TEST_ASSERTIVENESS !== null,
            label_list: condition.label_list,
            test_mode: TEST_MODE,
            phase2_boundary_conflicts: phase2Transition.unresolvedConcepts.join(','),
            phase3_boundary_conflicts: phase3Transition.unresolvedConcepts.join(','),
        });

        // responses of both participants, filled during the experiment, by concept_nr
        var phase1 = {};   // { naive_label, confederate_label, naive_choice, confederate_choice }

        // The assigned label is authoritative; manual entry remains a separate diagnostic.
        function confederateLabel(c) {
            return submittedLabel(c.scripted_label);
        }

        function conceptData(c) {
            return {
                concept_nr: c.concept_nr,
                concept_id: c.concept_id,
                stimulus: c.image,
                is_filler: c.is_filler,
                label_goodness: c.label_goodness,
                scripted_confederate_label: c.scripted_label,
                confederate_label: confederateLabel(c),
            };
        }

        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //----------------------Confederate behaviour (change here, not in the trials)----------------------------------------------------------------------------------------------//
        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        // true: the confederate pushes their own label for this concept (assertive, or compliant filler)
        function confederateInsists(c) {
            return (condition.assertiveness === 'assertive') !== c.is_filler;
        }

        // phase 1: which of the two labels the confederate chooses at the end
        function phase1ConfederateChoice(c, ownLabel, partnerLabel) {
            return confederateInsists(c) ? ownLabel : partnerLabel;
        }

        // Phase 2 guidance only: the confederate always makes the final feedback choice.
        function phase2ConfederateAssessment(c, term) {
            var match = { distance: null, swapped_parts: null };
            var comparisonError = null;
            try {
                if (!labelSimilarityReady()) throw new Error('resources/label_similarity.js is not available');
                var result = LabelSimilarity.compare(term, confederateLabel(c));
                if (!result || !Number.isInteger(result.distance) || result.distance < 0 ||
                        typeof result.swapped_parts !== 'boolean') {
                    throw new Error('Label comparison returned an invalid result');
                }
                match = result;
            } catch (err) {
                comparisonError = String(err && err.message || err);
                console.error('Phase 2 similarity check failed; manual feedback remains available:', err);
            }
            var limit = CONFIG.phase2_similarity_max_distance;
            if (!Number.isInteger(limit) || limit < 0) limit = 3;
            var status, matchType, recommended;
            if (!confederateInsists(c)) {
                status = 'green'; matchType = 'condition_compliant'; recommended = 'richtig';
            } else if (comparisonError !== null) {
                status = 'unavailable'; matchType = 'comparison_unavailable'; recommended = null;
            } else if (phase2LabelsEqual(term, confederateLabel(c))) {
                status = 'green'; matchType = 'exact'; recommended = 'richtig';
            } else if (normalize(term) && normalize(confederateLabel(c)) &&
                    (match.swapped_parts || match.distance <= limit)) {
                status = 'yellow'; matchType = match.swapped_parts ? 'swapped_parts' : 'edit_distance'; recommended = null;
            } else {
                status = 'red'; matchType = 'different'; recommended = 'falsch';
            }
            return {
                traffic_light: status,
                label_match_type: matchType,
                label_edit_distance: match.distance,
                label_parts_swapped: match.swapped_parts,
                label_comparison_error: comparisonError,
                recommended_feedback: recommended,
            };
        }

        function strategyText(c) {
            return confederateInsists(c)
                ? '<b>Eigenen Begriff durchsetzen</b>'
                : '<b>Begriff der VP übernehmen</b>';
        }

        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //----------------------Screen building blocks------------------------------------------------------------------------------------------------------------------------------//
        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        function screen(html) { return '<div class="screen">' + html + '</div>'; }
        function imageHTML(c) { return '<img class="stim" src="' + c.image + '">'; }
        function confPanel(html, modifier) {
            return isConf ? '<div class="conf' + (modifier ? ' ' + modifier : '') + '">' + html + '</div>' : '';
        }
        function phase1ConfPanel(c, html) {
            return confPanel(html, c.is_filler ? 'conf--filler' : '');
        }
        function confHeader(c) {
            return 'Bedingung: <b>' + condition.assertiveness + '</b> · Bild ' + c.concept_nr + (c.is_filler ? ' · <b>FILLER</b>' : '') +
                ' · Label: <b>' + c.label_goodness + '</b>' +
                ' · Strategie: ' + strategyText(c);
        }

        function phase2TrafficHTML(assessment) {
            var status = assessment.traffic_light;
            var title = { green: 'Grün', yellow: 'Gelb', red: 'Rot', unavailable: 'Ampel nicht verfügbar' }[status];
            var message = status === 'unavailable' ? 'Bitte manuell prüfen und selbst entscheiden.'
                : assessment.label_match_type === 'condition_compliant'
                ? 'In dieser Strategie immer „Richtig“ wählen.'
                : status === 'green' ? 'Der Begriff stimmt mit deinem Begriff aus Teil 1 überein.'
                : status === 'yellow' ? (assessment.label_parts_swapped
                    ? 'Möglicherweise vertauschte Wortteile. Bitte prüfen und selbst entscheiden.'
                    : 'Ähnliche Schreibweise. Bitte prüfen und selbst entscheiden.')
                : 'Abweichender Begriff. Falls er dennoch nah genug ist, kannst du „Richtig“ wählen.';
            return '<div class="traffic-light ' + status + '" id="phase2-traffic-light" data-status="' + status + '" role="status">' +
                '<span class="traffic-lamps" aria-hidden="true"><span class="traffic-lamp lamp-red"></span>' +
                '<span class="traffic-lamp lamp-yellow"></span><span class="traffic-lamp lamp-green"></span></span>' +
                '<div><b>' + title + '</b><br>' + message + '</div></div>';
        }

        function showWaiting(el, text) {
            el.innerHTML = screen('<p class="waiting">' + (text || 'Bitte warten …') + '</p>');
        }

        // text input (shown in capitals) + "Weiter" button; onSubmit(text) is called once with the
        // trimmed input in capitals, i.e. as the participant saw it
        function labelInputHTML() {
            var limit = textInputMaxLength();
            return '<p><input class="label-input" id="label-input" type="text" autocomplete="off" spellcheck="false" ' +
                'maxlength="' + limit + '" aria-describedby="label-error" style="text-transform: uppercase"></p>' +
                '<p class="input-error" id="label-error" role="alert"></p>' +
                '<button class="btn" id="label-submit" type="button" disabled>Weiter</button>';
        }
        function onLabelSubmit(el, onSubmit) {
            var input = el.querySelector('#label-input');
            var btn = el.querySelector('#label-submit');
            var error = el.querySelector('#label-error');
            var submitted = false;
            input.focus();
            input.addEventListener('input', function () {
                error.textContent = '';
                btn.disabled = submitted || input.value.trim() === '';
            });
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!btn.disabled) btn.click();
                }
            });
            btn.addEventListener('click', function () {
                if (submitted) return;
                var label = submittedLabel(input.value);
                if (!label || label.length > textInputMaxLength()) {
                    error.textContent = !label ? 'Bitte gib einen Begriff ein.' :
                        'Bitte kürze deinen Begriff auf maximal ' + textInputMaxLength() +
                        ' Zeichen (einschließlich der Großschreibung).';
                    input.focus();
                    return;
                }
                submitted = true;
                btn.disabled = true;
                input.disabled = true;
                onSubmit(label);
            });
        }

        // countdown in the element #timer; onEnd() is called once when the time is up
        function startCountdown(ctx, el, ms, onEnd) {
            var end = Date.now() + ms;
            var ended = false;
            var tick = function () {
                var left = Math.max(0, end - Date.now());
                var t = el.querySelector('#timer-value');
                if (t) t.textContent = formatTime(left);
                if (left === 0 && !ended) {
                    ended = true;
                    if (onEnd) onEnd();
                }
            };
            tick();
            ctx.every(250, tick);
        }
        function timerHTML() { return '<div class="timer" id="timer">Verbleibende Zeit: <span id="timer-value"></span></div>'; }

        function instructions(html, data) {
            return {
                type: jsPsychHtmlButtonResponse,

        // Keep the unattended screen consistent with the room-change explanation.

            'Sie begleitet dich in einen anderen Raum, in dem du den letzten Teil des Experiments bearbeitest.</p>';

        // saves everything collected so far (same file name every time, so the file is overwritten)
        function saveTrial(isFinal) {
            return {
                type: jsPsychPairTrial,
                data: { phase: 'save' },
                render: function (el, ctx) {
                    var filename = PATHS.filePrefix + pairID + '_' + role + '_' + START_TIME + '.csv';
                    if (isFinal) showWaiting(el, 'Daten werden gespeichert …');
                    var body = new URLSearchParams({ filename: filename, filedata: jsPsych.data.get().csv() });

                        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
                        .then(function () { ctx.finish({ saved: true, filename: filename }); })
                        .catch(function (err) {
                            console.error('saving failed', err);
                            // keep the data in any case: download it in the browser

        var connect = {

                    if (!TEST_MODE) return ctx.finish();

                    var useSharedCondition = function (shared) {
                        if (!shared || CONFIG.assertiveness_conditions.indexOf(shared.assertiveness) === -1) {
                            showWaiting(el, 'Ungültige Testbedingung. Bitte startet den Test auf beiden Computern neu.');

                            assertiveness: condition.assertiveness,
                            test_condition_override: shared.overridden === true,

                    };
                    if (isConf) {
                        var shared = { assertiveness: condition.assertiveness, overridden: TEST_ASSERTIVENESS !== null };
                        PairSync.sendValue('test_condition', shared, function () { useSharedCondition(shared); });
                    } else {
                        PairSync.getPartnerValue('test_condition', useSharedCondition);
                    }
                });
            },
        };

            type: jsPsychPreload,

        var general_intro = instructions(
            '<h2>Willkommen zum Experiment!</h2>' +
            '<p>In dieser Studie geht es darum, Bilder zu benennen und passende Begriffe dafür zu finden. ' +
            'Eure Begriffe müssen <strong>nicht unbedingt bereits existierende Wörter</strong> sein. Wichtig ist, dass sie die Bilder, ' +

        //----------------------Phase 1 - Grounding (shared)------------------------------------------------------------------------------------------------------------------------//
        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        var phase1_instructions = instructions(
            '<p>Ihr seht beide dasselbe Bild auf eurem Bildschirm.</p>' +
            '<p> Überlegt euch unabhängig voneinander <strong>einen Begriff der das Bild bestmöglich beschreibt</strong> ' +

            '<p> Sobald ihr beide fertig seid, werden eure Begriffe gleichzeitig angezeigt. ' +

        // 1. both enter a label, then wait for the partner's label
        function phase1Label(c) {
            return {
                type: jsPsychPairTrial,
                data: Object.assign({ phase: 'phase1', step: 'label' }, conceptData(c)),
                render: function (el, ctx) {
                    showWaiting(el, 'Warte auf die andere Person …');
                    // both see the same image at the same time
                    PairSync.waitForPartner('phase1_start_c' + c.concept_nr, function () {
                        var t0 = performance.now();
                        var timeExceeded = false;
                        var labelSubmitted = false;
                        el.innerHTML = screen(
                            phase1ConfPanel(c, confHeader(c) + '<br>Bitte diesen Begriff eingeben: <b style="font-size:20px">' +
                                caps(c.scripted_label) + '</b>') +
                            imageHTML(c) +
                            '<p>Welcher Begriff beschreibt dieses Bild am besten?</p>' +
                            labelInputHTML() + timerHTML());

                            if (labelSubmitted) return;
                            timeExceeded = true;

                            t.classList.add('over');
                            t.textContent = 'Die Zeit ist um. Bitte gib jetzt deinen Begriff ein.';
                        });
                        onLabelSubmit(el, function (label) {
                            labelSubmitted = true;
                            var rt = Math.round(performance.now() - t0);
                            showWaiting(el, 'Warte auf die Eingabe der anderen Person …');
                            PairSync.sendValue('phase1_label_c' + c.concept_nr, label);
                            PairSync.getPartnerValue('phase1_label_c' + c.concept_nr, function (partnerLabel) {
                                var typed = isConf ? label : partnerLabel;
                                phase1[c.concept_nr] = {
                                    naive_label: isConf ? partnerLabel : label,
                                    confederate_label: confederateLabel(c),
                                    confederate_typed_label: typed,
                                    confederate_label_mismatch: normalize(typed) !== normalize(confederateLabel(c)),
                                };
                                ctx.finish({
                                    response: label, partner_label: partnerLabel, rt: rt, time_exceeded: timeExceeded,
                                    confederate_label: confederateLabel(c),
                                    confederate_typed_label: typed,

                                });
                            });
                        });
                    });
                },
            };
        }

        // 2. both labels are shown until the discussion deadline or both confirm early
        function phase1Discussion(c) {
            return {
                type: jsPsychPairTrial,
                data: Object.assign({ phase: 'phase1', step: 'discussion' }, conceptData(c)),
                render: function (el, ctx) {
                    var p = phase1[c.concept_nr];
                    var own = isConf ? p.confederate_label : p.naive_label;
                    var partner = isConf ? p.naive_label : p.confederate_label;
                    var phrases = (confederateInsists(c) ? CONFIG.confederate_phrases.insist : CONFIG.confederate_phrases.yield)
                        .map(function (s) {
                            return '<li>' + escapeHTML(s).replace('{own}', caps(own)).replace('{partner}', caps(partner)) + '</li>';
                        }).join('');

                    var confirmed = false;
                    el.innerHTML = screen(
                        phase1ConfPanel(c, confHeader(c) + '<br>Am Ende wählen: <b>' +
                            caps(phase1ConfederateChoice(c, own, partner)) + '</b><ul>' + phrases + '</ul>') +
                        imageHTML(c) +
                        '<div class="labels">' +
                        '<div>Dein Begriff<div class="word">' + caps(own) + '</div></div>' +
                        '<div>Begriff der anderen Person<div class="word">' + caps(partner) + '</div></div>' +

                            ctx.finish({ own_label: own, partner_label: partner, ended_by: reason });

                        completeDiscussion('timeout');

        }

        // 3. private choice between the two labels
        function phase1Choice(c) {
            return {
                type: jsPsychPairTrial,
                data: Object.assign({ phase: 'phase1', step: 'choice' }, conceptData(c)),
                render: function (el, ctx) {
                    var t0 = performance.now();

                    var own = isConf ? p.confederate_label : p.naive_label;
                    var partner = isConf ? p.naive_label : p.confederate_label;
                    var scripted = phase1ConfederateChoice(c, own, partner);
                    // position of the two labels on screen is randomised
                    var options = jsPsych.randomization.shuffle([
                        { label: own, source: 'own', caption: 'dein Begriff' },
                        { label: partner, source: 'partner', caption: 'Begriff der anderen Person' },
                    ]);

                        phase1ConfPanel(c, confHeader(c) + '<br>Bitte wählen: <b>' + caps(scripted) + '</b> (markiert)') +
                        imageHTML(c) +
                        '<p><b style="color:#c62828">Die Diskussion ist abgeschlossen.</b> Wählt jetzt, <strong>ohne weiter miteinander zu sprechen</strong>, ' +
                        'den Begriff, den ihr persönlich bevorzugt.</p>' +
                        options.map(function (o, i) {
                            var rec = isConf && (o.source === 'own') === confederateInsists(c);
                            return '<button class="btn label-choice' + (rec ? ' recommended' : '') + '" data-i="' + i + '">' +
                                '<span style="font-size:22px"><b>' + caps(o.label) + '</b></span><br><small>(' + o.caption + ')</small></button>';
                        }).join(''));
                    el.querySelectorAll('button[data-i]').forEach(function (btn) {
                        btn.addEventListener('click', function () {
                            var o = options[parseInt(btn.dataset.i)];
                            var rt = Math.round(performance.now() - t0);
                            showWaiting(el, 'Warte auf die Wahl der anderen Person …');
                            PairSync.sendValue('phase1_choice_c' + c.concept_nr, o.label);
                            PairSync.getPartnerValue('phase1_choice_c' + c.concept_nr, function (partnerChoice) {
                                p.naive_choice = isConf ? partnerChoice : o.label;
                                p.confederate_choice = isConf ? o.label : partnerChoice;

                                    response: o.label,
                                    chose_own_label: o.source === 'own',

                                    partner_label: partner,

                    });

                        '<div class="labels labels-stacked">' +

                        '</div>');

            if (CONFIG.phase1_reveal_choices) t.push(phase1Reveal(c));

        var phase2_instructions = isConf
            ? instructions(
                '<h2>Teil 2 (Confederate-Ansicht)</h2>' +
                '<p>Die VP gibt für jedes Bild einen Begriff ein. Du siehst den Begriff, deinen Begriff aus Teil 1 ' +
                'und die aktuelle Strategie, und klickst <b>Richtig</b> oder <b>Falsch</b>. ' +
                '<strong>Maximal ' + CONFIG.phase2_max_attempts + ' Versuche </strong> pro Bild.</p>' +
                '<p>Assertive: Grün bei deinem Begriff, Gelb bei ähnlicher Schreibweise oder möglicherweise vertauschten Wortteilen, ' +
                'sonst Rot. Compliant: immer Grün und „Richtig“. Bei Fillern umgekehrt.</p>' +

            : instructions(

                '<p>Du siehst jeweils <strong>ein Bild</strong> auf deinem Bildschirm. Die andere Person sieht <strong>mehrere ähnliche Bilder</strong>, darunter auch deines.</p>' +
                '<p>Deine Aufgabe ist es, einen Begriff einzugeben, der dein Bild möglichst gut beschreibt, ' +
                'damit die andere Person das richtige Bild auswählen kann.</p>' +
                '<p>Nach jeder Auswahl erfahrt ihr, ob das richtige Bild ausgewählt wurde.</p>' +
                '<p>Ihr habt <strong>maximal ' + CONFIG.phase2_max_attempts + ' Versuche</strong> pro Bild.</p>', { step: 'phase2' });

        var phase2_instruction_pages = [phase2_instructions];
        if (!isConf) {
            phase2_instruction_pages.push(instructions(
                '<figure class="phase2-example">' +

                'width="1448" height="1086"></figure>', { step: 'phase2_example' }));

        function feedbackHTML(feedback, isLast) {

                '<button class="btn" id="feedback-next">Weiter</button>';

        // one attempt; the loop in phase2Concept repeats it until "richtig" or max attempts
        function phase2Attempt(c, st) {

                type: jsPsychPairTrial,

        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//

        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//

        var phase2_end = {
            type: jsPsychPairTrial,

                PairSync.waitForPartner('phase2_end', function () {
                    el.innerHTML = '<div class="instructions">' + (isConf
                        ? roomChangeMessage
                        : '<h2>Dieser Teil ist abgeschlossen.</h2>' +
                          '<p>Die andere Person verlässt jetzt den Raum. Bitte warte, bis du alleine bist, und klicke anschließend auf „Weiter“.</p>' +
                          '<button class="btn" id="go">Weiter</button>') + '</div>';
                    if (isConf) return ctx.finish();
                    el.querySelector('#go').addEventListener('click', function () { ctx.finish(); });
                });
            },
        };

        var phase3_instructions = instructions(
            '<p>Im letzten Teil siehst du die Bilder aus dem Experiment noch einmal.</p>' +
            '<p>Gib zu jedem Bild den Begriff ein, <strong>der deiner Meinung nach am besten dazu passt</strong>.</p>' +
            '<p>Entscheide ganz für dich, wie du das Bild jetzt nennen würdest.</p>',
            { step: 'phase3' });

        function phase3Naming(c) {
            return {
                type: jsPsychPairTrial,
                data: Object.assign({ phase: 'phase3', step: 'label' }, conceptData(c)),
                render: function (el, ctx) {
                    var t0 = performance.now();
                    el.innerHTML = screen(imageHTML(c) +
                        '<p>Welcher Begriff beschreibt dieses Bild am besten?</p>' + labelInputHTML());
                    onLabelSubmit(el, function (label) {
                        var p = phase1[c.concept_nr] || {};
                        ctx.finish({
                            response: label,
                            rt: Math.round(performance.now() - t0),
                            // main dependent variable: does the answer equal the confederate's label from phase 1?
                            confederate_label: confederateLabel(c),
                            matches_confederate_label: normalize(label) === normalize(confederateLabel(c)),
                            phase1_own_label: p.naive_label,
                            phase1_own_choice: p.naive_choice,
                            matches_phase1_own_label: normalize(label) === normalize(p.naive_label),
                        });
                    });
                },
            };
        }

        var phase3 = {
            timeline: [phase3_instructions].concat(phase3Order.map(phase3Naming)),
            conditional_function: function () { return !isConf; },
        };

        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //----------------------End--------------------------------------------------------------------------------------------------------------------------------------------------//
        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        var exit_fullscreen = {
            type: jsPsychFullscreen,
            fullscreen_mode: false,
            delay_after: 0,
        };

        var final = {
            type: jsPsychHtmlButtonResponse,
            stimulus: isConf
                ? '<div class="instructions">' + roomChangeMessage + '</div>'
                : '<p><b>Vielen Dank! Du hast alle Aufgaben abgeschlossen.</b></p>' +
                  '<p>Bitte bleib noch kurz sitzen und warte auf die Versuchsleitung.</p>',
            choices: [],
            data: { phase: 'end' },
        };

        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        //----------------------Timeline---------------------------------------------------------------------------------------------------------------------------------------------//
        //-------------------------------------------------------------------------------------------------------------------------------------------------------------------------//
        var timeline = [].concat(
            [experimenter_screen, connect, preload, enter_fullscreen, general_intro, phase1_instructions],
            phase1_trials,
            [saveTrial(false)],
            phase2_instruction_pages,
            [phase2_ready],
            phase2_trials,
            [saveTrial(false), phase2_end, phase3, saveTrial(true), exit_fullscreen, final]
        );

        jsPsych.run(timeline);
    }
</script>
